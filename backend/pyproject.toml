[project]
name = "downloader-manager-backend"
version = "0.1.0"
description = "FastAPI backend for Downloader Manager: YouTube audio/video downloads via yt-dlp and FFmpeg"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47",  # yt-dlp uses it to embed cover art in M4A and Opus
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "dnspython>=2.6",
    "psycopg[binary]>=3.1",
    "email-validator>=2.1",
    "disposable-email-domains>=0.0.100",
    "sentry-sdk[fastapi]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on calls in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
