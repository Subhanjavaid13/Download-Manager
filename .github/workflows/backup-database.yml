name: Weekly database backup

# The Supabase free tier has no backups at all. This dumps the database every
# Sunday and keeps the gzipped dump as a GitHub Actions artifact on the run.
#
# An artifact is the right home for it now that the app stores nothing
# remotely: no bucket to create, no keys to rotate, and the dump is two clicks
# away on the run page. The cost is that artifacts are not forever - the
# retention below is the whole retention policy, and a dump older than that is
# gone. If you want a copy that outlives it, download the newest artifact
# somewhere durable once in a while.
#
# The dump contains every user record in the project, and anyone who can read
# this repository's Actions can download it. Keep the repository private.
#
# Repository secret it needs (Settings > Secrets and variables > Actions).
# The value is never printed; GitHub masks it in the log.
#
#   SUPABASE_DB_URL   Supabase > Connect > "Session pooler" URI, port 5432.
#                     NOT the transaction pooler on 6543: that has no session
#                     state and pg_dump's COPY protocol fails against it.
#
# Restore: see the "Rollback" section of docs/DEPLOYMENT.md.

on:
  schedule:
    - cron: "31 4 * * 0" # Sundays, 04:31 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  dump:
    name: pg_dump to an artifact
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: "30"

    steps:
      - name: Check the database URL is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::missing repository secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Install the PostgreSQL 17 client
        # The runner ships an older pg_dump, and pg_dump refuses to dump a server
        # newer than itself. Supabase projects are on 15 or 17, so take 17.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          pg_dump --version

      - name: Dump the database
        id: dump
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          file="dm-${stamp}.sql"

          # public  = the app's own tables (profiles, downloads, events).
          # auth    = Supabase's user records, which cannot be recreated.
          # Owners and grants are Supabase-managed, so they are left out; a
          # restore re-applies them from supabase/migrations.
          if ! pg_dump "$SUPABASE_DB_URL" \
                --no-owner --no-privileges \
                --schema=public --schema=auth \
                --file="$file"; then
            echo "::warning::could not dump the auth schema; falling back to public only"
            pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
              --schema=public --file="$file"
          fi

          # A zero-byte or near-empty dump is the failure mode that goes
          # unnoticed for months. Catch it here instead.
          bytes=$(wc -c < "$file")
          if [ "$bytes" -lt 2000 ]; then
            echo "::error::dump is only ${bytes} bytes - refusing to store it"
            exit 1
          fi
          grep -q "CREATE TABLE" "$file" || {
            echo "::error::dump contains no CREATE TABLE statements"
            exit 1
          }

          gzip -9 "$file"
          echo "file=${file}.gz" >> "$GITHUB_OUTPUT"
          echo "name=dm-backup-${stamp}" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "${file}.gz")" >> "$GITHUB_OUTPUT"

      - name: Keep the dump as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.name }}
          path: ${{ steps.dump.outputs.file }}
          # A year of weekly dumps. GitHub allows up to 400 days on a private
          # repository and clamps this to 90 on a public one.
          retention-days: 365
          if-no-files-found: error
          compression-level: 0 # the file is already gzipped

      - name: Summary
        env:
          NAME: ${{ steps.dump.outputs.name }}
          FILE: ${{ steps.dump.outputs.file }}
          BYTES: ${{ steps.dump.outputs.bytes }}
        run: |
          {
            echo "### Database backup"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | ${NAME} |"
            echo "| File | ${FILE} |"
            echo "| Size | ${BYTES} bytes gzipped |"
            echo ""
            echo "Download it from the Artifacts section at the bottom of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the backup failed
        if: failure()
        run: |
          title="Weekly database backup failed"
          if gh issue list --state open --limit 100 --json title --jq '.[].title' \
              | grep -qxF "$title"; then
            echo "Issue already open."
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create --title "$title" --body "$(printf '%s\n' \
            "The weekly pg_dump did not complete, so this week has no backup artifact." \
            "" \
            "Run: ${run_url}" \
            "" \
            "Usual causes, in order:" \
            "1. SUPABASE_DB_URL points at the transaction pooler (6543)." \
            "   pg_dump needs the session pooler on 5432." \
            "2. The Supabase project paused after 7 days idle - open the" \
            "   dashboard once to wake it, and check the UptimeRobot monitor." \
            "3. The database password was rotated and the secret is stale." \
            "" \
            "There is no other copy of this database. Fix it this week.")"
