# Local production-like run of the backend (same image Render uses).
#   docker compose up --build
# API: http://localhost:8000/health
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DM_CORS_ORIGINS: '["http://localhost:3000"]'
      DM_DOWNLOAD_DIR: /data/downloads
    volumes:
      - downloads:/data/downloads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  downloads:
